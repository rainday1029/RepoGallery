name: RepoGallery

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  Update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub Pages and Generate HTML
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}
        run: python scripts/generate_html.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          cp index.html "$RUNNER_TEMP/index.html"
          # Another push can land while this run is generating the page, which
          # turns this push into a non-fast-forward. Retry on top of wherever
          # the branch moved to, keeping this run's generated file.
          for attempt in 1 2 3; do
            git add index.html
            git commit -m "Auto-update index.html" || echo "No changes to commit"
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying on top of the latest $GITHUB_REF_NAME"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/index.html" index.html
          done
          echo "Could not push after 3 attempts"
          exit 1

      - name: Prepare deployment folder
        run: |
          rm -rf public
          mkdir public
          cp index.html public/
          mkdir -p public/templates
          find templates -type d -name js -exec sh -c 'mkdir -p public/$(dirname {}); cp -R {} public/$(dirname {})' \;
          find templates -type d -name css -exec sh -c 'mkdir -p public/$(dirname {}); cp -R {} public/$(dirname {})' \;
          # Ship only the local files the generated page references. The rest of
          # assets/ is build time input (the yaml files) and README screenshots,
          # none of which belong in the deployed site.
          python - <<'PY'
          import os, re, shutil
          html = open('index.html', encoding='utf-8').read()
          for ref in sorted(set(re.findall(r'(?:src|href)="([^"#?]+)', html))):
              if re.match(r'[a-z]+:|//|/', ref) or ref.startswith('templates/') or ref == 'index.html':
                  continue
              if os.path.isfile(ref):
                  os.makedirs(os.path.join('public', os.path.dirname(ref)), exist_ok=True)
                  shutil.copy(ref, os.path.join('public', ref))
                  print('copied', ref)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 1

  Deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
      contents: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [Update]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
